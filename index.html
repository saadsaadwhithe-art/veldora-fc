<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veldora FC | متجر أطقم وقمصان كرة القدم</title>
    <meta name="description" content="متجر Veldora FC لأحدث قمصان وأطقم كرة القدم للمنتخبات والأندية العالمية بأثمنة مناسبة وتوصيل لجميع المدن.">
    <meta name="keywords" content="Veldora FC, veldora-fc, قمصان كرة القدم, أطقم رياضية, مبابي, ميسي, رونالدو, حكيمي">
    <meta name="robots" content="index, follow">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-green: #059669;
            --bright-blue: #0284c7;
            --gold-accent: #f59e0b;
            --bg-light: #f0f9ff;
            --card-white: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(16, 185, 129, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 90% 20%, rgba(2, 132, 199, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 50% 90%, rgba(245, 158, 11, 0.15) 0%, transparent 50%);
            min-height: 100vh;
        }

        header {
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border-bottom: 3px solid var(--primary-green);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.9rem;
            font-weight: 900;
            color: var(--primary-green);
            letter-spacing: 1px;
        }

        .logo span { color: var(--bright-blue); }

        .nav-links a {
            color: var(--text-dark);
            text-decoration: none;
            margin-right: 20px;
            font-weight: 700;
            font-size: 1.05rem;
            transition: color 0.2s;
        }

        .nav-links a:hover { color: var(--primary-green); }

        .hero {
            text-align: center;
            padding: 55px 20px;
            background: linear-gradient(135deg, #059669 0%, #0284c7 100%);
            color: #ffffff;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.2);
        }

        .hero h1 {
            font-size: 2.6rem;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 1.15rem;
            max-width: 680px;
            margin: 0 auto 20px;
            opacity: 0.95;
        }

        .delivery-badge {
            display: inline-block;
            background: #ffffff;
            color: var(--text-dark);
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-dark);
            margin: 45px 0 25px;
            padding-right: 15px;
            border-right: 6px solid var(--primary-green);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-white);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.07);
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--primary-green);
            box-shadow: 0 15px 30px rgba(5, 150, 105, 0.2);
        }

        .card-img {
            width: 100%;
            height: 250px;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .card:hover .card-img img { transform: scale(1.07); }

        .card-body {
            padding: 18px;
            text-align: center;
            border-top: 1px solid #f1f5f9;
        }

        .team-tag {
            display: inline-block;
            background: #e0f2fe;
            color: var(--bright-blue);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 20px;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .card-price {
            font-size: 1.35rem;
            font-weight: 900;
            color: var(--primary-green);
            margin-bottom: 10px;
        }

        .btn-view {
            display: block;
            width: 100%;
            padding: 10px;
            background: linear-gradient(90deg, var(--primary-green), var(--bright-blue));
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal-box {
            width: 100%;
            max-width: 960px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            position: relative;
            animation: zoomIn 0.25s ease;
            border: 4px solid #ffffff;
        }

        @keyframes zoomIn {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-bg {
            padding: 30px;
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 25px;
            align-items: center;
            position: relative;
        }

        .bg-vibrant-layer {
            position: absolute;
            inset: 0;
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            filter: saturate(1.55) contrast(1.12);
            z-index: 0;
        }

        .modal-layer {
            position: relative;
            z-index: 1;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 20;
            background: #ef4444;
            color: #fff;
            border: 2px solid #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .showcase-stage {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 15px;
            background: transparent;
            border-radius: 20px;
            padding: 20px 15px 0 15px;
            min-height: 340px;
            overflow: hidden;
        }

        .shirt-preview {
            width: 52%;
            max-height: 270px;
            object-fit: contain;
            background: #ffffff;
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 20px;
            border: 3px solid #ffffff;
