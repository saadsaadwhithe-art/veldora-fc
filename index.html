            background-image:

            margin-right: 20px;
            font-weight: 700;
            font-size: 1.05rem;
            transition: color 0.2s;
        }

        .nav-links a:hover { color: var(--primary-green); }

            background: linear-gradient(135deg, #059669 0%, #0284c7 100%);

            font-size: 2.6rem;
            font-weight: 900;
            margin-bottom: 10px;

            margin: 0 auto 20px;
            opacity: 0.95;
        }

        .delivery-badge {
            display: inline-block;
            background: #ffffff;
            color: var(--text-dark);
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1rem;

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-dark);
            margin: 45px 0 25px;
            padding-right: 15px;
            border-right: 6px solid var(--primary-green);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-white);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.07);
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--primary-green);
            box-shadow: 0 15px 30px rgba(5, 150, 105, 0.2);
        }

            background: #f8fafc;

            justify-content: center;
            padding: 10px;
